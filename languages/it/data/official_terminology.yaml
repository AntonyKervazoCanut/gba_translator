matching:
  key: exact_english_name
  pokeapi_ids_are_cfru_indices: false
  automatic_replacement: false
  rule: 'Lire le nom anglais dans la cellule de la ROM EN propre atteinte par le pointeur vivant. Faire
    une jointure par nom anglais exact. Absence, homonyme ou alias : décision manuelle sourcée, jamais
    par index ni rapprochement flou.'
  divergences: 503
  divergences_rule: '350 attaques et 153 talents : incluent abréviations et typographie, pas 503 corrections
    certaines.'
  duplicate_rule: Fusionner seulement les homonymes dont toutes les formes IT sont identiques ; homonymes
    divergents dans ambiguous_names, exclus des dictionnaires automatiques (Storage Key). IDs documentaires
    uniquement.
category_decisions:
  types:
    sources:
    - pokeapi
    - pokemon_pokedex
    decision: 18 types usuels, noms complets ; Astrale, ??? et Ombra exclus de cette table sans décider
      des mécaniques Unbound.
  moves:
    sources:
    - pokeapi
    - pokemon_training
    decision: Noms complets du corpus, jointure EN exacte et revue de chaque forme >12 octets.
  abilities:
    sources:
    - pokeapi
    - pokemon_training
    decision: Noms complets du corpus ; les quatre écarts confirmés sont des décisions de curation, pas
      des injections.
  items:
    sources:
    - pokeapi
    - pokemon_training
    decision: Noms complets ; exclusions et abréviations de cellules à qualifier dans PARITE, aucune reprise
      aveugle du dictionnaire du patch.
  natures:
    sources:
    - pokeapi
    - pokemon_training
    decision: 25 noms, correspondance par nom anglais, jamais ordre PokeAPI = ordre moteur.
  stats:
    sources:
    - pokeapi
    - pokemon_training
    decision: Conserver les huit libellés du corpus ; PS est le libellé officiel abrégé, développement
      Punti Salute ; formes courtes séparées.
  statuses:
    sources:
    - status_reference
    - project
    decision: Noms de conditions et états adjectivaux séparés ; badges conservés comme conventions locales,
      non certifiés officiellement.
  generic_locations:
    sources:
    - pokemon_lets_go
    - pokemon_training
    - market_reference
    - project
    decision: Centro Pokémon et Percorso attestés officiellement, Pokémon-Market secondaire ; autres génériques
      = convention éditoriale IT, pas toponymes officiels Unbound.
  unbound_names:
    sources:
    - project
    decision: Conservation EN des noms propres uniques ; aucune localisation officielle IT de Borrius
      établie.
constrained_cells:
  fallback_languages: []
  rule: Nom complet si encodable et dans le budget. Sinon uniquement une forme explicitement approuvée
    pour cette cellule ; aucune troncature automatique. À défaut laisser la traduction actuelle en attente
    de curation (ce maintien ne vaut pas approbation). Vérifier terminateur, voisin et largeur rendue
    avant injection.
  move_names:
    cell_bytes: 13
    max_glyphs: 12
  ability_names:
    cell_bytes: 17
    max_glyphs: 16
  item_names:
    cell_bytes: 14
    max_glyphs: 13
    struct_stride: 44
    description_pointer_offset: 20
  species_names:
    cell_bytes: 11
    max_glyphs: 10
  trainer_classes:
    cell_bytes: 13
    max_glyphs: 12
  terminator: 0xFF inclus dans cell_bytes ; max_glyphs valable seulement pour glyphes mono-octet sans
    contrôle
  display_overrides: {}
  cfru_type_names:
    terminator: 0x00, hors budget utile ; slots intégrés dans des phrases
    cells:
    - offset: '0x3FE894'
