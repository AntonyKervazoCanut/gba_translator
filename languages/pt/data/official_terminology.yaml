policy:
  priority:
  - official_pt_br_same_game_concept
  - explicit_project_choice
  - preserve_english
  pt_pt: Ne jamais traiter une source pt-PT ou une page /pt/ non identifiée comme une preuve pt-BR. Vérifier la
    région Brasil et conserver le contexte du média.
  unlisted: Conserver exactement le nom anglais de la ROM pour toute entrée non répertoriée. Une nouvelle exception
    exige URL primaire, date, concept identique, variante rejetée et test, dans un même commit.
  updates: Aucune actualisation automatique au fil des sites officiels. Toute révision est explicite, versionnée
    et vérifiée contre les contraintes ROM.
  cells: Ne jamais tronquer silencieusement un nom canonique. Si le budget octets/pixels échoue, conserver le nom
    anglais existant et documenter une exception de rendu par offset dans le lot ; aucune abréviation improvisée.
  infrastructure: Les termes contenant ã õ Ã Õ dépendent de F-758 ; le glossaire Unicode ne prouve pas leur rendu
    ROM.
status_display:
  abbreviations:
    poison: PSN
    burn: QMD
    freeze: CNG
    paralysis: PAR
    sleep: DRM
    faint: DES
  classification: project_choice
  decision: Codes existants conservés pour stabilité ; aucune source primaire consultée ne les atteste comme abréviations
    officielles PT-BR. PSN conserve le code anglais ; QMD/CNG/PAR/DRM sont des conventions locales.
  text_table: '0x3DFE18'
  stride_bytes: 8
  cell_bytes: 4
  glyphs: 3
  faint_applied: false
  battle_badges_localized: false
  evidence: 'status_abbrevs suit les cinq pointeurs vivants ; PSN/PAR sont inchangés, trois écritures DRM/QMD/CNG
    ; faint ignoré. Aucun patch status_badges déclaré : les badges graphiques de combat restent anglais.'
  ko: DES provisoire et inactif ; ne pas revendiquer son affichage. Ne modifier KO qu’avec localisation réelle du
    texte/graphisme et preuve de rendu dans un ticket dédié.
