# Inventaire exécutable des traitements localisables du build FR et de leur état DE.
# Toute nouvelle étape, module ou ressource FR doit être ajoutée ici avec un
# équivalent DE existant ou une exclusion motivée.
schema_version: 1
source_language: fr
target_language: de

descriptor_fields:
  - {source: code, classification: format_control, status: equivalent, target: code}
  - {source: name, classification: format_control, status: equivalent, target: name}
  - {source: native_name, classification: pointer_text, status: equivalent, target: native_name}
  - {source: builder_language, classification: format_control, status: equivalent, target: builder_language}
  - {source: status, classification: format_control, status: equivalent, target: status}
  - source: build
    classification: format_control
    status: excluded
    reason: Le build FR dédié et le build DE générique sont volontairement distincts.
  - {source: combined, classification: pointer_text, status: equivalent, target: combined}
  - {source: critical, classification: pointer_text, status: equivalent, target: critical}
  - {source: output_rom, classification: rom_test, status: equivalent, target: output_rom}
  - {source: patch_source, classification: format_control, status: equivalent, target: patch_source}
  - {source: version_label, classification: fixed_table, status: equivalent, target: version_label}
  - {source: font_glyphs, classification: font, status: equivalent, target: font_glyphs}
  - {source: status_abbrev, classification: fixed_table, status: equivalent, target: status_abbrev}

build_steps:
  - {source: gendered_buffers, classification: format_control, status: equivalent, target: gendered_buffers}
  - {source: font, classification: font, status: equivalent, target: font}
  - {source: fixed_table_names, classification: fixed_table, status: equivalent, target: fixed_table_names}
  - {source: item_names, classification: fixed_table, status: equivalent, target: item_names}
  - {source: time_format, classification: asm_patch, status: equivalent, target: time_format}
  - {source: battle_prefix, classification: asm_patch, status: equivalent, target: battle_prefix}
  - {source: inline, classification: fixed_table, status: shared, target: inline}
  - {source: repair_lz77, classification: lz77_graphic, status: shared, target: repair_lz77}
  - {source: repair_localized_lz77, classification: lz77_graphic, status: shared, target: repair_localized_lz77}
  - {source: summary_labels, classification: fixed_table, status: equivalent, target: summary_labels}
  - {source: repoint_stale, classification: format_control, status: shared, target: repoint_stale}
  - source: nickname_prompt
    classification: pointer_text
    status: excluded
    reason: "La routine EN compose déjà naturellement « <espèce>: Spitzname? » depuis la chaîne DE; l'inversion Thumb est propre à « Surnom de »."
  - {source: legendary_ritual, classification: format_control, status: shared, target: legendary_ritual}
  - {source: version, classification: fixed_table, status: shared, target: version}
  - {source: pokedex, classification: pointer_text, status: equivalent, target: pokedex_rewrap}
  - {source: pokedex_metrics, classification: fixed_table, status: equivalent, target: pokedex_metrics}
  - {source: pokedex_categories, classification: fixed_table, status: equivalent, target: pokedex_categories}
  - {source: pokedex_category_order, classification: asm_patch, status: equivalent, target: pokedex_category_order}
  - source: move_descriptions
    classification: pointer_text
    status: excluded
    reason: Les descriptions DE passent par le réinséreur générique relocalisant; le rapport final exige zéro échec de relocalisation.
  - source: dup_move_descriptions
    classification: pointer_text
    status: excluded
    reason: Les doublons DE suivent le même réinséreur générique et sont couverts par l'empreinte ROM finale.
  - source: tm_item_descriptions
    classification: pointer_text
    status: excluded
    reason: Les descriptions CT/CS DE vivent dans combined_de.txt et sont validées par les audits de couverture et de pointeurs.
  - source: meteorite_dialogue
    classification: pointer_text
    status: excluded
    reason: Le dialogue DE est injecté par combined_de.txt; le patch FR n'est requis que pour sa formulation et sa capacité propres.
  - {source: worldmap_junction, classification: pointer_text, status: equivalent, target: worldmap_junction_panels}
  - {source: cfru_type_names, classification: fixed_table, status: equivalent, target: cfru_type_names}
  - {source: status_abbrevs, classification: fixed_table, status: shared, target: status_abbrevs}
  - {source: levelup_stat_abbreviations, classification: fixed_table, status: equivalent, target: levelup_stat_abbreviations}
  - {source: battle_string_templates, classification: format_control, status: equivalent, target: battle_string_templates}
  - {source: battle_recall_strings, classification: pointer_text, status: equivalent, target: battle_recall_strings}
  - {source: status_badges, classification: lz77_graphic, status: equivalent, target: status_badges}
  - {source: type_icons, classification: lz77_graphic, status: equivalent, target: type_icons}
  - {source: shop, classification: fixed_table, status: equivalent, target: shop}
  - {source: mission_titles, classification: pointer_text, status: equivalent, target: mission_titles}
  - {source: mission_descriptions, classification: pointer_text, status: equivalent, target: mission_descriptions}
  - source: money_amount_order
    classification: asm_patch
    status: excluded
    reason: La localisation DE conserve explicitement le préfixe « ¥{montant} »; inverser le template et les chaînes inline serait une régression.
  - source: summary_lv_labels
    classification: fixed_table
    status: excluded
    reason: Le marqueur officiel DE reste « Lv »; la substitution « N. » et sa rotation d'espace sont exclusivement françaises.

# Étapes déjà actives dans la recette DE sans étape homonyme côté FR. Les
# inventorier ici évite qu'un ticket ultérieur les recrée sous un second nom.
de_only_build_steps:
  - {source: ability_names, classification: fixed_table, status: excluded, reason: Déjà couvert directement par la recette DE.}
  - {source: battle_summary_sprites, classification: lz77_graphic, status: excluded, reason: Sources raster finales combat et résumé propres à la recette DE.}
  - {source: collision_check, classification: format_control, status: excluded, reason: Contrôle de sûreté propre à la recette DE.}
  - {source: cry_label, classification: fixed_table, status: excluded, reason: Déjà couvert directement par la recette DE.}
  - {source: dexnav_headers, classification: lz77_graphic, status: excluded, reason: Déjà couvert directement par la recette DE.}
  - {source: givecs_gift_item, classification: format_control, status: excluded, reason: Déjà couvert directement par la recette DE.}
  - {source: hp_labels, classification: lz77_graphic, status: excluded, reason: Déjà couvert directement par la recette DE.}
  - {source: menu_sprites, classification: lz77_graphic, status: excluded, reason: Assets menus et monde couverts directement par la recette DE.}
  - {source: move_names, classification: fixed_table, status: excluded, reason: Déjà couvert directement par la recette DE.}
  - {source: mission_tab_labels, classification: fixed_table, status: excluded, reason: Port DE du module dédié FR; il traduit All en Alle et neutralise le suffixe runtime.}
  - {source: nature_names, classification: fixed_table, status: excluded, reason: Déjà couvert directement par la recette DE.}
  - {source: options_footer, classification: fixed_table, status: excluded, reason: Déjà couvert directement par la recette DE.}
  - {source: pc_messages, classification: fixed_table, status: excluded, reason: Déjà couvert directement par la recette DE.}
  - {source: pc_move_labels, classification: pointer_text, status: excluded, reason: Port DE limité à la cellule courrier no-pointer encore anglaise.}
  - {source: pokedex_stat_labels, classification: fixed_table, status: excluded, reason: Port DE des deux tables de statistiques fixes.}
  - {source: screen_graphics, classification: lz77_graphic, status: excluded, reason: Écrans titre et Carte Dresseur déjà couverts directement par la recette DE.}
  - {source: species_names, classification: fixed_table, status: excluded, reason: Déjà couvert directement par la recette DE.}
  - {source: summary_stat_labels, classification: lz77_graphic, status: excluded, reason: Libellés graphiques du résumé déjà couverts directement par la recette DE.}
  - {source: trainer_card_date, classification: asm_patch, status: excluded, reason: Déjà couvert directement par la recette DE.}
  - {source: trainer_class_names, classification: fixed_table, status: excluded, reason: Port DE de la table de classes fixe et bornée.}
  - {source: world_map_action_labels, classification: fixed_table, status: excluded, reason: Actions de carte couvertes directement par la recette DE.}
  - {source: worldmap_labels, classification: pointer_text, status: excluded, reason: Noms propres de carte restaurés directement par la recette DE.}
  - {source: worldmap_route_panels, classification: pointer_text, status: excluded, reason: Panneaux routiers canoniques EN couverts directement par la recette DE.}
  - {source: zone_names, classification: pointer_text, status: excluded, reason: Restauration DE des noms de zones originaux EN.}

