# German language descriptor — Pokémon Unbound EN→DE
# Glossaire officiel figé : languages/de/data/official_terminology.yaml.
#
# All 12 translation batches are covered and the final release recipe is
# certified by languages/de/release.yaml.
# German is built by the generic driver `scripts/build_language.py de`.
# Translations live in languages/de/combined_de.txt (same `<offset_hex>:
# <text>` format as combined_fr.txt). Offsets not present there stay
# English — this still includes proper names/credits and corrupted/garbage
# cells. Move descriptions are only partly reached by the generic pipeline:
# B-688 checks live pointers and documents extraction gaps requiring B-1013
# (docs/analysis/688_PARITE_DESCRIPTIONS_DE.md). No dedicated DE patch yet;
#
# Other tables are covered:
# the species-name table, move-name table, ability-name table, mission/
# world-map text and the one-off fixed-table name cells are now covered by
# the species_names/move_names/ability_names/mission_descriptions/
# worldmap_junction_panels/fixed_table_names steps below — F-83, #81.
#
# ä ö ü Ä Ö Ü are now in the charmap (slots 0xF1-0xF6) and have glyphs
# drawn by languages/de/patches/font.py. The `font` step must be scheduled
# after repair_lz77/repair_localized_lz77 (B-211) — see the patches: list.
code: de
name: German
native_name: Deutsch
builder_language: german          # value passed to the generic builder --language
status: complete                  # complete | in_progress
build: generic                    # dedicated (make build-fr) | generic (build_language.py)

combined: languages/de/combined_de.txt
critical: languages/de/critical_strings_de.txt   # optional; created when needed
output_rom: GenedRom-de.gba
patch_source: input/roms/englishrom.gba
# Shown in-game on the NOT FOR SALE screen as DE.2.1.<build> (the trailing
# component is the CI build number stamped by the `version` patch step).
version_label: DE.2.1.0

# Extra glyphs the font must render beyond plain ASCII.
font_glyphs: "äöüßÄÖÜ"

# In-game status-condition abbreviations (official DE localisation).
status_abbrev:
  poison: GIF
  burn: VBR
  freeze: GEF
  paralysis: PAR
  sleep: SCH
  faint: KO

# Post-build patches applied by scripts/build_language.py.
# `font` runs languages/de/patches/font.py which draws ä ö ü Ä Ö Ü glyphs.
# It is scheduled with the other LZ77 graphic patches (status_badges,
# type_icons, hp_labels, dexnav_headers), AFTER repair_lz77 / repair_
# localized_lz77 below — those two treat any LZ77 block that is byte-
# identical between EN and ES as "should never differ" and revert it to
# English, which used to silently wipe the umlaut glyphs on every build
# because the unpatched font block is EN=ES (B-211).
#
# Anti-freeze / anti-corruption (language-agnostic mechanics — always applied):
#   repair_lz77            restore stable EN=ES LZ77 UI blocks corrupted by the builder
#   repair_localized_lz77  copy localized (EN≠ES) LZ77 blocks from the Spanish ROM
#   repoint_stale          re-target text pointers reverted by the LZ77 repair passes
#   legendary_ritual       restore Ho-Oh/Lugia cutscene setflag chain clobbered by repointer
#
# Language-aware (data already in status_abbrev above):
#   status_abbrevs         write DE status abbreviations (GIF/VBR/GEF/SCH/…) into ROM
#   status_badges          redraw the in-battle status badge tiles (LZ77 graphics)
#                          with DE glyphs (GIF/SCH/GEF/VBR/KO) — the graphical
#                          counterpart of the text status_abbrevs above
#   hp_labels              redraw the HP-label graphics (party menu + summary bar
#                          + summary grey stat label — all LZ77 tiles, not text)
#                          with the German « KP » (Kraftpunkte)
#   dexnav_headers         redraw the 4 DexNav column-header graphics (custom
#                          Unbound LZ77 tileset, not text) with German labels
#                          (SUCHLEVEL / METHODE / VERST. FAEH. / ITEMS)
#   version                stamp the NOT FOR SALE screen with DE.2.1.<build>
#                          so the running build advertises it is the German one
#
# Battle-text / control-code-timing / positional-gender-buffer patches
# (ported from the FR pipeline; see patch_<name>_de.py for German-specific
# rationale — some, like battle_prefix, need no cave hack in German because
# the language's natural word order already matches the engine's layout):
#   gendered_buffers         fixed-size buffer strings (son/daughter/boy/girl/
#                            man/lady/her) patched to German where they fit
#   battle_prefix            report-only guard for the wild/foe name-prefix
#                            cells (no reorder cave needed in German)
#   givecs_gift_item         restore the give-CS gift-item struct from English
#                            (except the localized name prefix) to prevent it
#                            silently diverging if a translation overflows it
#   battle_string_templates  restore the language-neutral defeat-speech /
#                            switch-out control-code cluster from English
#   battle_recall_strings    German "komm/kommt zurück!" switch-out messages,
#                            relocated via their external pointer table
#   cry_label                Pokémon-list "Cry" menu entry -> "Schrei" (B-188):
#                            "Schrei" (6 glyphs) overflows the fixed 3-glyph
#                            cell, so this relocates the body to free space
#                            and repoints its two known external pointers
#                            (0x105FE4 / 0x1067B8) via languages/de/patches/
#                            cry_label.py — same mechanism as battle_recall_strings.
#
# Inline code patches (not text data, no combined-file entry possible):
#   time_format             24h clock + DD.MM.YYYY save/date templates, DE weekday
#                            (So./Mo./…) and month-abbreviation cells
#   trainer_card_date       rebuilds the Trainer Card start date in Day Month Year
#                            order via a free-space builder + veneer redirect
#
# Richer passes ported from the French pipeline once combined_de.txt was
# complete:
#   mission_descriptions     47 bounty-mission descriptions, verbatim 3-line
#                            box (languages/de/patches/mission_descriptions.py)
#   worldmap_junction_panels 9 arrow-prefixed World-Map junction signs
#                            (languages/de/patches/worldmap_junction_panels.py)
#   ability_names            fixed-width 17-byte ability-name table, absent
#                            from translation_ready.json/Spanish extraction ←
#                            combined_de.txt (languages/de/patches/ability_names.py)
#   move_names               fixed-width 13-byte, 894-entry move-name table
#                            (live base resolved from the ROM's own pointer),
#                            ← combined_de.txt (languages/de/patches/move_names.py,
#                            delegates to languages/fr/patches/move_names.py — #81)
#   species_names            fixed-width 11-byte, 1293-entry species-name
#                            table @ 0x166A997, restored byte-for-byte from
#                            input/roms/englishrom.gba after every writing pass
#                            (languages/de/patches/species_names.py)
#   fixed_table_names        one-off class-2 fixed cells unreachable by any
#                            translation pass (Parcel/Package/Berry Pouch/Town
#                            Map/Hard Stone/TM Case bag names + the Weak Armor
#                            ability), German-specific NAME_FIXES dict (see
#                            languages/de/patches/fixed_table_names.py)
#
# mission_descriptions and worldmap_junction_panels both relocate to free
# space; the packed DE build has no EN∩ES-free space left after the main-text
# pass, so they are dispatched without --reference-rom (reserved=None) and
# scheduled at the very end of the list below, harvesting the EN-free/
# ES-populated pool the main pass never touches. See
# languages/de/patches/mission_descriptions.py for the full rationale.
patches:
  - gendered_buffers
  - time_format
  - inline
  - battle_prefix
  - repair_lz77
  - repair_localized_lz77
  # Sources raster DE éditables des menus hors combat. Cette étape doit rester
  # après les deux réparations LZ77, qui restaureraient sinon l'art anglais.
  - menu_sprites
  - repoint_stale
  - legendary_ritual
  - givecs_gift_item
  - status_abbrevs
  - battle_string_templates
  - battle_recall_strings
  - cry_label               # relocate+repoint "Cry"→"Schrei" (B-188, over-cap for the fixed cell)
  # Redraw the ä/ö/ü/Ä/Ö/Ü glyphs (LZ77 font tiles). MUST run after
  # repair_lz77/repair_localized_lz77 (B-211): those steps restore any LZ77
  # block that is byte-identical between EN and ES back to the English
  # reference, and the font blocks *are* EN=ES (neither has umlaut glyphs) —
  # running `font` before them let every rebuild silently wipe the umlauts
  # back to blank, even though the charmap encoding (0xF1-0xF6) stayed correct.
  - font
  - status_badges
  # Redraw the move-type badges (graphic tiles) with German names
  # (KAMPF/GIFT/DRACHE/…) via languages/de/patches/type_icons.py.
  - type_icons
  # Patch level-up stat-change abbreviations (Spez. Angr. / Spez. Vert.)
  # via languages/de/patches/levelup_stat_abbreviations.py.
  - levelup_stat_abbreviations
  # Redraw the HP-label graphics (LZ77 tiles) with German « KP » (Kraftpunkte)
  # via languages/de/patches/hp_labels.py.
  - hp_labels
  # Redraw all six summary-screen stat word-images with bounded official DE
  # labels. Runs after hp_labels because both patches share LZ77 block E9A460.
  - summary_stat_labels
  # Source raster finale de tous les graphismes combat/équipe/résumé. Elle
  # fige les sorties des générateurs ci-dessus et réinjecte chaque copie
  # divergente depuis languages/de/sprites, toujours après les réparations.
  - battle_summary_sprites
  # Redraw the 4 DexNav column-header graphics (custom Unbound LZ77 tileset)
  # with German labels (SUCHLEVEL / METHODE / VERST. FAEH. / ITEMS) via
  # languages/de/patches/dexnav_headers.py.
  - dexnav_headers
  # Inject the editable German title and Trainer Card screens only after both
  # LZ77 repair passes, so English reference restoration cannot erase them.
  - screen_graphics
  - version
  # Fixed-width name/description tables carrying baked official German
  # localisation content (Berries/items, natures, CFRU type names, Pokédex
  # category table + ordering + metric units, summary-screen labels, options
  # footer, shop strings, PC box messages). See languages/de/patches/<name>.py.
  - item_names
  - ability_names
  - move_names       # fixed 13-byte move-name table (live base resolved from ROM ptr) — #81
  - nature_names
  - cfru_type_names
  - pokedex_categories
  - pokedex_category_order
  - pokedex_metrics
  - pokedex_stat_labels
  - pokedex_rewrap
  - pokedex_stat_labels  # KP/Ang/Ver/Init/SpA/SpV, deux tables pointées
  - summary_labels
  - options_footer
  - shop
  - pc_messages
  - pc_move_labels       # cellule no-pointer « Move To Bag » → « Zum Beutel »
  - trainer_card_date
  - fixed_table_names
  - item_names_objets02  # B-1027 : 104 cellules exclusivement, depuis combined_de
  - trainer_class_names  # table fixe 13 octets, préimages EN strictes
  # Pointer-relocated text passes the generic pipeline drops. Both run LAST
  # (after `inline` and every other relocation) and are dispatched without a
  # --reference-rom, so they harvest the ~29 KB EN-free/ES-populated pool that
  # the main-text relocation pass deliberately avoids — the packed DE build has
  # no EN∩ES-free space left, so excluding ES bytes here would abort the patch
  # with 0/47 (the free-space blocker tracked in the F-83 split ticket). See
  # languages/de/patches/mission_descriptions.py for the full rationale.
  #   mission_descriptions   47 bounty-mission descriptions, verbatim 3-line box
  #   worldmap_junction_panels  9 arrow-prefixed World-Map junction signs
  # Cellules fixes de la carte : conserver les noms propres EN et stabiliser
  # les actions DE après toutes les relocalisations.
  - worldmap_labels
  - zone_names           # restaure les cinq noms de zones originaux EN
  - world_map_action_labels
  - mission_tab_labels   # « All » → « Alle » et supprime le suffixe runtime
  - mission_titles       # « The Food Thief » → « Der Essensdieb » in-place
  - combat_ui_structure  # B-1013 : 67 textes structurés, après les réparations
  - mission_descriptions
  - worldmap_junction_panels
  - worldmap_route_panels
  - dialogue_routing  # B-1016 : sept textes, huit consommateurs explicites
  - zone_names
  # Restore all 1,293 fixed species-name cells from the canonical EN ROM after
  # every writing patch.  No German/FR name list participates in this copy.
  - species_names
  # Post-build audit: flag any translated cell not terminated before its
  # neighbour (fusion / freeze risk). Report-only, never fails the build.
  - collision_check
