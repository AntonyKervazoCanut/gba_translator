# Entrées protégées DE — SOURCE DE VÉRITÉ des corrections validées (issues/tickets).
#
# scripts/check_translation_integrity.py vérifie que combined_de.txt (règle
# last-wins, comme la chaîne de build) résout chaque offset EXACTEMENT à
# `expected` (ou qu'il reste ABSENT si `absent: true`). Toute divergence fait
# échouer le pre-commit (make test-python-fast) ET make build-de.
#
# - Correction volontaire d'une entrée protégée → mettre à jour `expected` ici
#   DANS LE MÊME COMMIT que combined_de.txt.
# - Fix perdu (snapshot périmé, Pattern C) → python3 scripts/check_translation_integrity.py --fix --lang de
# - Toute entrée déjà perdue une fois par un commit périmé DOIT être ajoutée ici.
#
# Format d'une entrée :
#   - offset: "0x123456"
#     name: "Description courte"
#     issue: "#NN"                       # optionnel
#     expected: 'Texte exact attendu'    # quoting simple : \n reste littéral
#     forbidden: ['Forme périmée']       # optionnel, message d'erreur plus clair
#   # ou, pour un offset qui doit rester absent du fichier :
#   - offset: "0x123456"
#     name: "..."
#     absent: true
#
# Voir docs/20_TRANSLATION_PRESERVATION.md §7.
entries:
- offset: '0x1ede63b'
  name: "B-678 — dialogues-06 0x1EDE63B"
  expected: 'Verzeihung...\pMöchten Sie eine\n{COLOR}ÉSpezialität{COLOR}Ë?\pOui, oui, ja, das möchten Sie.'
- offset: '0x1edfb75'
  name: "B-678 — dialogues-06 0x1EDFB75"
  expected: 'Angehender Champ!\pOder sollte ich sagen: Champ?\pLange nicht gesehen!\pMeine Tipps haben dir wohl wirklich\ngeholfen, was?\pWillkommen im Battleground!\pIn diesem Club kannst du gegen die\nBesten von Borrius kämpfen.\pGenieß deine Zeit hier, zumal du\njetzt selbst zu ihnen gehörst!\pAch, und wenn du an der\n{COLOR}ÉArenaleiter-Herausforderung{COLOR}Ë\lteilnehmen willst, komm zu mir.'
- offset: '0x1ee118a'
  name: "B-678 — dialogues-06 0x1EE118A"
  expected: 'Ah, {PLAYER}. Ich hoffe, es geht\ndir gut.\pNein, ich bin nicht im Auftrag\nhier.\pIch habe meine...{PAUSE}\npersönlichen Gründe.\pDu bist doch jetzt der neue Champ\nder Borrius-Region, oder?\pMeine Pflichten als Arenaleiter und\nAgent zwingen mich oft,...{PAUSE}\lmeine wahre Stärke zu verbergen.\pDoch jetzt, da wieder Frieden\nherrscht, kann ich mir wohl etwas\lgönnen.\pWenn du magst, möchtest du deine\nKräfte mit mir messen?\pNatürlich weiß ich, dass du mir\nmeine Taten am Cinder Volcano\lvielleicht noch übel nimmst.\pSieh es doch als\nGelegenheit,...{PAUSE} deinen\langestauten Frust loszuwerden.'
- offset: '0x1ee1904'
  name: "B-678 — dialogues-06 0x1EE1904"
  expected: 'Ich sagte einmal, du hättest das\nZeug für den Geheimdienst.\pDoch inzwischen glaube ich, deine\njetzige Aufgabe passt am besten\lzu dir.\pEin Leben im Verborgenen ist für\ndie, deren Geheimnisse... niemals\lans Licht kommen dürfen...\pUnd ich...{PAUSE} nein, vergiss es.\pSolche Dinge sollte ein gefeierter\nHeld wie du nicht wissen.'
- offset: '0x1ee29f6'
  name: "B-678 — dialogues-06 0x1EE29F6"
  expected: 'Neulich hab ich überlegt, was ich\nwohl täte, wenn ich meinen Hut an\lden Nagel hänge und den\lArenaleiter-Job hinschmeiße.\pIch seh ja nicht ewig so gut aus,\nweißt du?\pZiemlich ernüchternd. Aber ich war\nmal mit einer Frau zusammen... die\lsagte, man kann nicht alles\lfesthalten.\pAlso... ich werde mit der Zeit\nwürdevoll altern. Und keine Minute\lfrüher, klar?'
- offset: '0x1ee2f9f'
  name: "B-678 — dialogues-06 0x1EE2F9F"
  expected: '{COLOR}ÉMetallium Z{COLOR}Ë,\n{COLOR}ÉVoltium Z{COLOR}Ë...\lDiese zwei Kristalle verstärken\l{COLOR}ÉStahl{COLOR}Ë- und\l{COLOR}ÉElektro{COLOR}Ë-Attacken.\pSchade, dass man nicht beide im\nselben Kampf nutzen kann. Tja, das\lLeben ist eben manchmal unfair.\pEhrlich, ich weiß selbst nicht,\nwomit ich das Kampffeld lieber\laufmische.\pSie mit\n{COLOR}ÉTurbo-Spiralkombo{COLOR}Ë\lin den Boden rammen...\pOder sie mit einer guten alten\n{COLOR}ÉGigavolt-Funkensalve{COLOR}Ë\lzuckend am Boden liegen lassen?\pBeide sind klasse!'
- offset: '0x1ee3c49'
  name: "B-678 — dialogues-06 0x1EE3C49"
  expected: 'Na, Schätzchen! So ein Zufall,\ndich hier zu sehen!\pNach unserem Arenakampf hab ich\nmir furchtbar Sorgen um dich\lgemacht. Wohl ganz umsonst!\pIch? Ach... auch ich muss mal aus\ndem Sumpf raus, um den Kopf\lfreizukriegen.\pAußerdem sollen sich hier die\nBesten von Borrius treffen.\pMuss wohl stimmen, wenn du hier\nbist.\pDa wir beide gerade Zeit haben...\nLust auf noch eine Runde? Du und\lich?\pLetztes Mal warst du etwas\nverzweifelt. Als ginge es bei\lmeinem Orden um Leben und Tod.\pDiesmal will ich sehen, was\nwirklich in dir steckt, {PLAYER}.\pNa, was sagst du? Ich kann''s kaum\nerwarten, dir auch unsere\lFortschritte zu zeigen!'
- offset: '0x1ee563c'
  name: "B-678 — dialogues-06 0x1EE563C"
  expected: 'Siehst du das Pokémon hier neben\nmir?\pEs ist das Mysteriöse\nTriumph-Pokémon\l{COLOR}ÉVictini{COLOR}Ç.\pEs soll seinen Trainern den Sieg\nbringen.\pDoch das klappt nur, wenn Victini\nseine Kraft mit seinem Trainer\lteilen will.\pLeider will es offenbar niemandem\nhelfen, der sich zu sehr auf es\lverlässt.\pVielleicht... wenn es einen Trainer\nsähe, der immer wieder ohne Wunder\lgewinnt...\pJetzt fällt mir ein: Du bist doch\nder Champ, oder?\pDie Arenaleiter kommen oft in\ndiesen Club...\pDa dachte ich: Wenn du alle acht\nnoch einmal besiegen könntest...\pKönntest du\n{COLOR}ÉVictini{COLOR}Ç zeigen,\ldass du würdig bist, sein idealer\lTrainer zu sein?'
