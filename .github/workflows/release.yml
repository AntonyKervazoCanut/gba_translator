name: Publish tracked BPS patches (FR + IT + DE + Indie)

on:
  push:
    branches: [unbound, master]
    paths:
      - "patches/**"
      - ".github/workflows/release.yml"
      - "scripts/notify_discord_release.py"
  workflow_dispatch:

concurrency:
  group: patch-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish persistent patches
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate tracked patch bundle
        run: |
          python3 scripts/verify_patch_bundle.py patches \
            --required fr it de indie

      - name: Resolve bundle version
        id: bundle
        run: |
          BUILD_NUMBER=$(python3 -c \
            'import json; print(json.load(open("patches/RELEASE_MANIFEST.json"))["build_number"])')
          case "${BUILD_NUMBER}" in
            ''|*[!0-9]*) echo "::error::Invalid patch build number"; exit 1 ;;
          esac
          test "${BUILD_NUMBER}" -gt 0 || {
            echo "::error::Patch build number must be positive"
            exit 1
          }
          echo "build_number=${BUILD_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "version_tag=v2.1.${BUILD_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Publish versioned release and replace latest
        id: publish_releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.bundle.outputs.version_tag }}
          LATEST_TAG: latest
          BUILD_NUMBER: ${{ steps.bundle.outputs.build_number }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          RELEASE_DIR=$(mktemp -d)
          trap 'rm -rf "${RELEASE_DIR}"' EXIT
          ASSETS=()
          for code in fr it de indie; do
            patch="${RELEASE_DIR}/pokemon_unbound_${code}_${VERSION_TAG}.bps"
            cp "patches/pokemon_unbound_${code}.bps" "${patch}"
            ASSETS+=("${patch}")
          done
          ASSETS+=(
            "patches/RELEASE_MANIFEST.json"
            "patches/SHA256SUMS.txt"
          )
          NOTES=$(printf '**Commit :** %s — %s\n\nBundle BPS suivi et validé sans ROM (build #%s).\n\n- FR: pokemon_unbound_fr_%s.bps\n- IT: pokemon_unbound_it_%s.bps\n- DE: pokemon_unbound_de_%s.bps\n- Indie: pokemon_unbound_indie_%s.bps' \
            "${SHA}" "${MSG}" "${BUILD_NUMBER}" \
            "${VERSION_TAG}" "${VERSION_TAG}" "${VERSION_TAG}" "${VERSION_TAG}")

          if gh release view "${VERSION_TAG}" >/dev/null 2>&1; then
            VERIFY_DIR=$(mktemp -d)
            gh release download "${VERSION_TAG}" --dir "${VERIFY_DIR}"
            LEGACY_ASSETS=()
            for code in fr it de indie; do
              current="${VERIFY_DIR}/pokemon_unbound_${code}_${VERSION_TAG}.bps"
              legacy="${VERIFY_DIR}/pokemon_unbound_${code}.bps"
              if [ -f "${current}" ]; then
                cmp -- "patches/pokemon_unbound_${code}.bps" "${current}" || exit 1
              fi
              if [ -f "${legacy}" ]; then
                cmp -- "patches/pokemon_unbound_${code}.bps" "${legacy}" || exit 1
                LEGACY_ASSETS+=("$(basename "${legacy}")")
              fi
              if [ ! -f "${current}" ] && [ ! -f "${legacy}" ]; then
                echo "::error::Versioned release ${VERSION_TAG} is missing ${code}."
                exit 1
              fi
            done
            cmp -- patches/RELEASE_MANIFEST.json "${VERIFY_DIR}/RELEASE_MANIFEST.json"
            cmp -- patches/SHA256SUMS.txt "${VERIFY_DIR}/SHA256SUMS.txt"
            for downloaded in "${VERIFY_DIR}"/*; do
              name=$(basename "${downloaded}")
              case "${name}" in
                RELEASE_MANIFEST.json|SHA256SUMS.txt|pokemon_unbound_fr.bps|pokemon_unbound_it.bps|pokemon_unbound_de.bps|pokemon_unbound_indie.bps|pokemon_unbound_fr_"${VERSION_TAG}".bps|pokemon_unbound_it_"${VERSION_TAG}".bps|pokemon_unbound_de_"${VERSION_TAG}".bps|pokemon_unbound_indie_"${VERSION_TAG}".bps) ;;
                *) echo "::error::Versioned release ${VERSION_TAG} has unexpected asset ${name}."; exit 1 ;;
              esac
            done
            if [ "${#LEGACY_ASSETS[@]}" -gt 0 ]; then
              gh release upload "${VERSION_TAG}" "${ASSETS[@]}" --clobber
              for legacy_asset in "${LEGACY_ASSETS[@]}"; do
                gh release delete-asset "${VERSION_TAG}" "${legacy_asset}" --yes
              done
            fi
            rm -rf "${VERIFY_DIR}"
            echo "Versioned release ${VERSION_TAG} already verified; resuming latest."
          else
            gh release create "${VERSION_TAG}" --target "${GITHUB_SHA}" \
              --title "Unbound 2.1.${BUILD_NUMBER}" --notes "${NOTES}" --latest=false \
              "${ASSETS[@]}"
          fi

          if gh release view "${LATEST_TAG}" >/dev/null 2>&1; then
            LATEST_ASSETS=()
            LATEST_ASSET_NAMES=$(gh release view "${LATEST_TAG}" \
              --json assets --jq '.assets[].name')
            while IFS= read -r latest_asset; do
              [ -n "${latest_asset}" ] && LATEST_ASSETS+=("${latest_asset}")
            done <<< "${LATEST_ASSET_NAMES}"
            LATEST_BUILD=0
            for latest_asset in "${LATEST_ASSETS[@]}"; do
              if [ "${latest_asset}" = "RELEASE_MANIFEST.json" ]; then
                LATEST_DIR=$(mktemp -d)
                gh release download "${LATEST_TAG}" --dir "${LATEST_DIR}" \
                  --pattern RELEASE_MANIFEST.json
                LATEST_BUILD=$(python3 -c \
                  'import json,sys; print(json.load(open(sys.argv[1]))["build_number"])' \
                  "${LATEST_DIR}/RELEASE_MANIFEST.json")
                rm -rf "${LATEST_DIR}"
                case "${LATEST_BUILD}" in
                  ''|*[!0-9]*) echo "::error::Invalid latest patch build number"; exit 1 ;;
                esac
                test "${LATEST_BUILD}" -gt 0 || {
                  echo "::error::Latest patch build number must be positive"
                  exit 1
                }
                break
              fi
            done
            if [ "${LATEST_BUILD}" -gt "${BUILD_NUMBER}" ]; then
              echo "latest reste sur le build supérieur ${LATEST_BUILD}."
              exit 0
            fi
            gh release edit "${LATEST_TAG}" \
              --title "Unbound 2.1.${BUILD_NUMBER} — latest" --notes "${NOTES}" \
              --prerelease
            for latest_asset in "${LATEST_ASSETS[@]}"; do
              expected=false
              for asset in "${ASSETS[@]}"; do
                if [ "${latest_asset}" = "$(basename "${asset}")" ]; then
                  expected=true
                  break
                fi
              done
              if [ "${expected}" = false ]; then
                gh release delete-asset "${LATEST_TAG}" "${latest_asset}" --yes
              fi
            done
            gh release upload "${LATEST_TAG}" "${ASSETS[@]}" --clobber
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${LATEST_TAG}" \
              -f sha="${GITHUB_SHA}" -F force=true
          else
            gh release create "${LATEST_TAG}" --target "${GITHUB_SHA}" \
              --title "Unbound 2.1.${BUILD_NUMBER} — latest" --notes "${NOTES}" \
              --prerelease "${ASSETS[@]}"
          fi

      - name: Publish release notes to Discord
        id: notify_discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.bundle.outputs.version_tag }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          gh release view "${VERSION_TAG}" --json name,tagName,body,url \
            > "${RUNNER_TEMP}/discord-release.json"
          python3 scripts/notify_discord_release.py "${RUNNER_TEMP}/discord-release.json"
